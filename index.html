<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tio Patinhas</title>
  <meta name="description" content="Meu assessor de gastos pessoais">
  <meta name="theme-color" content="#f5f6f4">
  <meta name="color-scheme" content="light dark">
  <script>
    // Aplica o tema antes de desenhar a tela, para não piscar.
    try {
      var t = localStorage.getItem('tp.tema');
      if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topo" hidden>
    <img src="icons/logo.svg" alt="" width="32" height="32" class="logo">
    <div class="topo-texto">
      <span class="marca">Tio Patinhas</span>
      <h1 id="titulo-aba">Início</h1>
    </div>
    <button type="button" id="btn-ajustes" class="avatar" aria-label="Ajustes e conta">?</button>
  </header>

  <section id="tela-login" class="login" hidden>
    <div class="login-marca">
      <img src="icons/icon.svg" alt="" width="88" height="88">
      <h1>Tio Patinhas</h1>
      <p>Seu assessor de gastos</p>
    </div>
    <form id="form-login" class="cartao">
      <label class="campo">Email<input id="login-email" type="email" autocomplete="email" required></label>
      <label class="campo">Senha<input id="login-senha" type="password" autocomplete="current-password" minlength="6" required></label>
      <button type="submit" class="btn primario largo">Entrar</button>
      <button type="button" id="criar-conta" class="btn secundario largo">Criar conta</button>
      <p id="login-aviso" class="aviso-login" role="status"></p>
      <p class="dica centro">Seus registros ficam guardados na nuvem, protegidos pela sua conta.</p>
    </form>
  </section>

  <main id="app" hidden>
    <div id="conteudo"></div>
  </main>

  <nav class="abas" aria-label="Seções" hidden></nav>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script src="js/vendor/supabase-2.118.0.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
