<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Tio Patinhas</title>
  <meta name="description" content="Meu assessor de gastos pessoais">
  <meta name="theme-color" content="#fafaf8">
  <meta name="color-scheme" content="light dark">
  <script>
    // Aplica o tema antes de desenhar a tela, para não piscar.
    try {
      var t = localStorage.getItem('tp.tema');
      if (t === 'escuro') document.documentElement.setAttribute('data-theme', 'dark');
      if (t === 'claro') document.documentElement.setAttribute('data-theme', 'light');
    } catch (e) {}
    // Link do email (nova senha ou entrar sem senha): guarda o tipo antes do Supabase limpar o endereço.
    if (/type=recovery/.test(location.hash)) window.__tpLinkEmail = 'senha';
    else if (/type=magiclink/.test(location.hash)) window.__tpLinkEmail = 'entrar';
    else if (/error_code=/.test(location.hash)) window.__tpLinkEmail = 'expirado';
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
  <link rel="stylesheet" href="css/style.css">
  <!-- Baixa todos os módulos de uma vez, em vez de um puxar o outro em cascata. -->
  <link rel="modulepreload" href="js/app.js">
  <link rel="modulepreload" href="js/store.js">
  <link rel="modulepreload" href="js/config.js">
  <link rel="modulepreload" href="js/tema.js">
  <link rel="modulepreload" href="js/categorias.js">
  <link rel="modulepreload" href="js/analise.js">
  <link rel="modulepreload" href="js/parser.js">
  <link rel="modulepreload" href="js/util.js">
  <link rel="modulepreload" href="js/graficos.js">
  <link rel="modulepreload" href="js/extrato.js">
  <link rel="modulepreload" href="js/telas/inicio.js">
  <link rel="modulepreload" href="js/telas/lancamentos.js">
  <link rel="modulepreload" href="js/telas/painel.js">
  <link rel="modulepreload" href="js/telas/metas.js">
  <link rel="modulepreload" href="js/telas/registro.js">
  <link rel="modulepreload" href="js/telas/anexos.js">
  <link rel="modulepreload" href="js/telas/contas.js">
  <link rel="modulepreload" href="js/telas/cartoes.js">
  <link rel="modulepreload" href="js/telas/alertas.js">
  <link rel="modulepreload" href="js/telas/revisar.js">
</head>
<body>
  <header class="topo" hidden>
    <div class="topo-texto">
      <h1 id="titulo-aba">Início</h1>
    </div>
    <button type="button" id="btn-ajustes" class="avatar" aria-label="Ajustes e conta">?</button>
  </header>

  <section id="tela-login" class="login" hidden>
    <div class="login-marca">
      <img src="icons/icon.svg" alt="" width="72" height="72">
      <h1>Tio Patinhas</h1>
      <p>Seu assessor de gastos</p>
    </div>
    <form id="form-login" class="cartao">
      <label class="campo">Email<input id="login-email" type="email" autocomplete="email" required></label>
      <label class="campo">Senha<input id="login-senha" type="password" autocomplete="current-password" minlength="6" required></label>
      <button type="submit" class="btn primario largo">Entrar</button>
      <button type="button" id="entrar-link" class="btn secundario largo">Entrar sem senha (link no email)</button>
      <p id="login-aviso" class="aviso-login" role="status"></p>
      <div class="login-links">
        <button type="button" id="esqueci-senha" class="link">Esqueci minha senha</button>
        <button type="button" id="criar-conta" class="link">Criar conta</button>
      </div>
      <p class="dica centro">Seus registros ficam guardados na nuvem, protegidos pela sua conta.</p>
    </form>
  </section>

  <main id="app" hidden>
    <div id="conteudo"></div>
  </main>

  <nav class="abas" aria-label="Seções" hidden></nav>

  <div id="toast" class="toast" hidden role="status" aria-live="polite"></div>

  <script defer src="js/vendor/supabase-2.118.0.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
